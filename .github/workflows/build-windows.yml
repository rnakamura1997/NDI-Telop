name: Build Windows Installer

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore src/NdiTelop/NdiTelop.csproj

    - name: Build
      run: dotnet build src/NdiTelop/NdiTelop.csproj --no-restore -c Release

    - name: Test
      run: dotnet test tests/NdiTelop.Tests/NdiTelop.Tests.csproj --no-build -c Release --verbosity normal

    - name: Install NDI Runtime
      shell: pwsh
      run: |
        winget install --id NDI.NDIRuntime --exact --accept-package-agreements --accept-source-agreements --silent

        $runtimeCandidates = @(
          "$env:ProgramFiles\NDI\NDI 6 Runtime\v6",
          "$env:ProgramFiles\NDI\NDI 6 Runtime",
          "$env:ProgramFiles\NewTek\NDI 5 Runtime\v5",
          "$env:ProgramFiles\NewTek\NDI 5 Runtime",
          "$env:ProgramFiles\NewTek\NDI 4 Runtime\v4",
          "$env:ProgramFiles\NewTek\NDI 4 Runtime"
        )

        $runtimeDir = $runtimeCandidates |
          Where-Object { Test-Path (Join-Path $_ 'Processing.NDI.Lib.x64.dll') } |
          Select-Object -First 1

        if (-not $runtimeDir) {
          throw 'Processing.NDI.Lib.x64.dll was not found after installing the NDI runtime.'
        }

        "NDI_RUNTIME_DIR=$runtimeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Publish Windows x64
      shell: pwsh
      run: |
        dotnet publish src/NdiTelop/NdiTelop.csproj `
          -c Release -r win-x64 `
          --self-contained true `
          -p:NdiRuntimeDir="$env:NDI_RUNTIME_DIR" `
          -o ./publish/win-x64

    - name: Verify published Windows payload
      shell: pwsh
      run: |
        $requiredFiles = @(
          'publish/win-x64/NdiTelop.exe',
          'publish/win-x64/NDILibDotNetCoreBase.dll',
          'publish/win-x64/Processing.NDI.Lib.x64.dll',
          'publish/win-x64/Assets/DefaultPresets/default_presets.json'
        )

        foreach ($file in $requiredFiles) {
          if (-not (Test-Path $file)) {
            throw "Required publish output was not found: $file"
          }
        }

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Get version
      id: version
      run: |
        $tag = if ("${{ github.ref }}" -match "refs/tags/v(.+)") { $matches[1] } else { "0.0.0-dev" }
        echo "VERSION=$tag" >> $env:GITHUB_ENV

    - name: Generate installer icon
      run: python scripts/generate_icon.py

    - name: Build Installer
      run: |
        Push-Location "$env:GITHUB_WORKSPACE/installer"
        try {
          iscc /DMyAppVersion="${{ env.VERSION }}" .\setup.iss
        }
        finally {
          Pop-Location
        }

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NdiTelop-Installer-v${{ env.VERSION }}
        path: installer/Output/NdiTelop-Setup-v*.exe

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: installer/Output/NdiTelop-Setup-v*.exe
