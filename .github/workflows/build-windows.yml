name: Build Windows Installer

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore src/NdiTelop/NdiTelop.csproj

    - name: Build
      run: dotnet build src/NdiTelop/NdiTelop.csproj --no-restore -c Release

    - name: Test non-GUI units only
      run: dotnet test tests/NdiTelop.Tests/NdiTelop.Tests.csproj --no-build -c Release --verbosity normal

    - name: Install NDI Runtime
      shell: pwsh
      run: |
        $installerPath = Join-Path $env:RUNNER_TEMP 'NDI 6 Runtime.exe'
        curl.exe -L 'https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20Runtime.exe' --output $installerPath

        if (-not (Test-Path $installerPath)) {
          throw 'Failed to download the NDI runtime installer.'
        }

        $installerArguments = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-')
        $installerProcess = Start-Process -FilePath $installerPath -ArgumentList $installerArguments -PassThru

        try {
          $installerProcess | Wait-Process -Timeout 180 -ErrorAction Stop
        }
        catch {
          if (-not $installerProcess.HasExited) {
            Stop-Process -Id $installerProcess.Id -Force
          }

          throw 'NDI runtime installer did not complete within 180 seconds.'
        }

        if ($installerProcess.ExitCode -ne 0) {
          throw "NDI runtime installer failed with exit code $($installerProcess.ExitCode)."
        }

        Start-Sleep -Seconds 60

        $runtimeCandidates = @(
          "$env:ProgramFiles\NDI\NDI 6 Runtime\v6",
          "$env:ProgramFiles\NDI\NDI 6 Runtime",
          "$env:ProgramW6432\NDI\NDI 6 Runtime\v6",
          "$env:ProgramW6432\NDI\NDI 6 Runtime",
          "$env:ProgramFiles\NewTek\NDI 5 Runtime\v5",
          "$env:ProgramFiles\NewTek\NDI 5 Runtime",
          "$env:ProgramFiles\NewTek\NDI 4 Runtime\v4",
          "$env:ProgramFiles\NewTek\NDI 4 Runtime"
        )

        $runtimeDir = $runtimeCandidates |
          Where-Object { Test-Path (Join-Path $_ 'Processing.NDI.Lib.x64.dll') } |
          Select-Object -First 1

        if (-not $runtimeDir) {
          $runtimeDir = Get-ChildItem -Path $env:ProgramFiles, $env:ProgramW6432 -Directory -Recurse -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName 'Processing.NDI.Lib.x64.dll') } |
            Select-Object -ExpandProperty FullName -First 1
        }

        if (-not $runtimeDir) {
          throw 'Processing.NDI.Lib.x64.dll was not found after installing the NDI runtime.'
        }

        Get-ChildItem $runtimeDir -Filter 'Processing.NDI.Lib*.dll' | ForEach-Object {
          Write-Host "Found NDI runtime dependency: $($_.FullName)"
        }

        "NDI_RUNTIME_DIR=$runtimeDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Publish Windows x64
      shell: pwsh
      run: |
        dotnet publish src/NdiTelop/NdiTelop.csproj `
          -c Release -r win-x64 `
          --self-contained true `
          -p:NdiRuntimeDir="$env:NDI_RUNTIME_DIR" `
          -o ./publish/win-x64

        $requiredNativeDlls = @(
          'Processing.NDI.Lib.x64.dll',
          'Processing.NDI.Lib.x86.dll'
        )

        foreach ($dll in $requiredNativeDlls) {
          $publishedPath = Join-Path $env:GITHUB_WORKSPACE "publish/win-x64/$dll"
          if (-not (Test-Path $publishedPath)) {
            $source = Join-Path $env:NDI_RUNTIME_DIR $dll
            if (-not (Test-Path $source)) {
              throw "Required NDI runtime dependency was not found: $source"
            }

            Copy-Item -Path $source -Destination $publishedPath -Force
          }
        }

    - name: Verify published Windows payload
      shell: pwsh
      run: |
        Write-Host 'Published file structure (depth 3):'
        Get-ChildItem -Path 'publish/win-x64' -Recurse -Depth 3 |
          Sort-Object FullName |
          ForEach-Object { Write-Host $_.FullName }

        $requiredFiles = @(
          'publish/win-x64/NdiTelop.exe',
          'publish/win-x64/NDILibDotNetCoreBase.dll',
          'publish/win-x64/Processing.NDI.Lib.x64.dll',
          'publish/win-x64/Assets/DefaultPresets/default_presets.json'
        )

        foreach ($file in $requiredFiles) {
          if (-not (Test-Path $file)) {
            throw "Required publish output was not found: $file"
          }
        }

        Write-Host 'CI validation intentionally stops at payload verification.'
        Write-Host 'The workflow must not run dotnet run, launch NdiTelop.exe, or execute the generated installer because GitHub Actions is not an interactive Windows desktop session.'

    - name: Install Inno Setup
      run: choco install innosetup -y

    - name: Get version
      id: version
      run: |
        $tag = if ("${{ github.ref }}" -match "refs/tags/v(.+)") { $matches[1] } else { "0.0.0-dev" }
        echo "VERSION=$tag" >> $env:GITHUB_ENV

    - name: Generate installer icon
      run: python scripts/generate_icon.py

    - name: Build Installer
      run: |
        Push-Location "$env:GITHUB_WORKSPACE/installer"
        try {
          iscc /DMyAppVersion="${{ env.VERSION }}" .\setup.iss
        }
        finally {
          Pop-Location
        }

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NdiTelop-Installer-v${{ env.VERSION }}
        path: installer/Output/NdiTelop-Setup-v*.exe

    - name: Publish manual verification guidance
      shell: pwsh
      run: |
        @"
        ## CI verification scope
        - GitHub Actions validates restore, build, non-GUI unit tests, publish output, and installer creation only.
        - This workflow intentionally does **not** run `dotnet run`, start `publish/win-x64/NdiTelop.exe`, or execute `NdiTelop-Setup-v*.exe`.
        - `ClassicDesktopLifetime` requires an interactive Windows desktop session, so GUI launch verification must be performed manually outside CI.

        ## Manual installer verification
        1. Download the `NdiTelop-Installer-v${{ env.VERSION }}` artifact from this workflow run.
        2. Copy the installer to an interactive Windows desktop machine (not GitHub Actions, not a Windows service, and not a non-interactive scheduled task).
        3. Run `NdiTelop-Setup-v*.exe` manually and complete the installation.
        4. Launch NdiTelop from the Start Menu or the installed executable.
        5. Confirm that the application reaches the main window without `System.PlatformNotSupportedException`.
        "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: installer/Output/NdiTelop-Setup-v*.exe
